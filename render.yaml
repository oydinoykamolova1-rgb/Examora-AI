services:
  # 1. Backend ASP.NET Core Web API
  - type: web
    name: examora-ai-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: SQLite

  # 2. Frontend React Vite Static Site (Static sites do not require region)
  - type: web
    env: static
    name: examora-ai-frontend
    rootDir: ./frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: examora-ai-backend
          property: url
        suffix: /api
